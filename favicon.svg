<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="php-shorturl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2f2c"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="18%" r="55%">
      <stop stop-color="#2dd4bf" stop-opacity=".32"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="82%" r="55%">
      <stop stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g1)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g2)"/>
  <g transform="rotate(-38 32 32)">
    <!-- teal link (back-left) -->
    <rect x="8" y="26" width="28" height="12" rx="6" fill="none" stroke="#2dd4bf" stroke-width="5.5"/>
    <!-- cyan link (front-right) -->
    <rect x="28" y="26" width="28" height="12" rx="6" fill="none" stroke="#38bdf8" stroke-width="5.5"/>
  </g>
  <!-- shortcut slash -->
  <path d="M21 43 L41 23" stroke="#0b1220" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M21 43 L41 23" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
  <!-- redirect arrow tip -->
  <path d="M39.5 16.5 L50 19 L42.5 28 Z" fill="#38bdf8"/>
</svg>
